name: Template Rename (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve repository metadata
        shell: bash
        run: |
          echo "REPOSITORY_NAME=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}' | tr '-' '_' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "REPOSITORY_URLNAME=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> "$GITHUB_ENV"
          echo "REPOSITORY_OWNER=$(echo '${{ github.repository }}' | awk -F '/' '{print $1}')" >> "$GITHUB_ENV"

      - name: Check template marker
        id: marker
        shell: bash
        run: |
          if [ -f .github/template.yml ]; then
            echo "is_template=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_template=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename project files
        if: steps.marker.outputs.is_template == 'true'
        shell: bash
        run: |
          echo "Renaming project with owner=${{ env.REPOSITORY_OWNER }}, name=${{ env.REPOSITORY_NAME }}, url=${{ env.REPOSITORY_URLNAME }}"
          .github/rename_project.sh \
            -a "${{ env.REPOSITORY_OWNER }}" \
            -n "${{ env.REPOSITORY_NAME }}" \
            -u "${{ env.REPOSITORY_URLNAME }}" \
            -d "Awesome ${{ env.REPOSITORY_NAME }} created by ${{ env.REPOSITORY_OWNER }}"

      - name: Commit changes
        if: steps.marker.outputs.is_template == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Template rename automation applied"
